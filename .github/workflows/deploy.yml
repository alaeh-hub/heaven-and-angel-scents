name: Deploy

# Deploys to the VPS over SSH (systemd + nginx, not Docker); see docs/PRODUCTION.md.
# Optional variables (Environments -> production), defaults match the server:
#   DEPLOY_PATH        app folder        (/var/www/heavenandangels)
#   DEPLOY_SERVICE     systemd unit      (heavenandangels)
#   DEPLOY_HEALTH_URL  must answer "ok"; use the public https address

on:
  # Automatic: after CI passes on a push to main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual: re-deploy or roll back from the Actions tab.
  workflow_dispatch:

# One deploy at a time; never cancel one half way.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    # Auto-deploy only after a green CI push run; manual runs skip this check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    env:
      # The commit CI tested (github.sha may be a newer commit on main).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/heavenandangels' }}
      DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE || 'heavenandangels' }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'https://heavenandangels.jampongcorp.tech/healthz' }}
    permissions:
      contents: read
      actions: read

    steps:
      # Refuse to deploy a commit whose CI run has not finished green.
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result="$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --commit "$DEPLOY_SHA" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          if [ "${result:-0}" -lt 1 ]; then
            echo "No successful CI run found for $DEPLOY_SHA; refusing to deploy." >&2
            exit 1
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key (secret DEPLOY_KNOWN_HOSTS = `ssh-keyscan -p PORT -H HOST`).
          # Required: trust-on-first-use would allow a MITM on the first run.
          if [ -z "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            echo "DEPLOY_KNOWN_HOSTS secret is not set; refusing to deploy." >&2
            exit 1
          fi
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # On the server: pull, back up DB, update deps, rebuild site, apply
      # schema.sql, restart, then fail unless the health URL answers.
      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || '22' }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s -- "$DEPLOY_PATH" "$DEPLOY_SERVICE" "$DEPLOY_HEALTH_URL" <<'REMOTE'
          set -euo pipefail
          APP_DIR="$1"; SERVICE="$2"; HEALTH_URL="$3"
          cd "$APP_DIR"

          # Read one KEY=value from .env without sourcing it (not valid shell).
          env_get() { grep -E "^$1=" .env | tail -n1 | cut -d= -f2- | tr -d '\r'; }
          DB_HOST="$(env_get MYSQL_HOST)"; DB_HOST="${DB_HOST:-localhost}"
          DB_USER="$(env_get MYSQL_USER)"; DB_USER="${DB_USER:-root}"
          DB_NAME="$(env_get MYSQL_DB)";   DB_NAME="${DB_NAME:-heaven_and_angel_scents}"
          export MYSQL_PWD="$(env_get MYSQL_PASSWORD)"

          # The virtualenv is named "venv" or ".venv".
          if [ -x venv/bin/pip ]; then VENV=venv; elif [ -x .venv/bin/pip ]; then VENV=.venv
          else echo "No virtualenv (venv or .venv) in $APP_DIR" >&2; exit 1; fi

          git pull --ff-only

          # Pre-deploy DB dump; the size check rejects an empty failed dump.
          mkdir -p backups
          dump="backups/pre_deploy_$(date +%Y%m%d_%H%M%S).sql.gz"
          mysqldump -h "$DB_HOST" -u "$DB_USER" --single-transaction --routines --triggers --events "$DB_NAME" | gzip > "$dump"
          [ "$(stat -c %s "$dump")" -gt 200 ] || { rm -f "$dump"; echo "pre-deploy dump is empty" >&2; exit 1; }
          find backups -name 'pre_deploy_*.sql.gz' -mtime +14 -delete

          "$VENV/bin/pip" install -q -r requirements.txt
          (cd public-site && npm ci --no-audit --no-fund && npm run build)

          mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" < schema.sql

          sudo systemctl restart "$SERVICE"

          for i in $(seq 1 30); do
            if [ "$(curl -fsS --max-time 5 "$HEALTH_URL" 2>/dev/null)" = "ok" ]; then
              echo "app is healthy"; exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy" >&2
          sudo journalctl -u "$SERVICE" -n 50 --no-pager >&2
          exit 1
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
