# Production stack: Caddy (HTTPS) -> web (gunicorn) -> db (MySQL), plus a
# one-shot schema migration and a daily backup job.
# Required in .env (see .env.example): DOMAIN, DB_ROOT_PASSWORD, DB_APP_PASSWORD,
# SECRET_KEY. Used by CI's smoke test and local runs; production uses systemd (see docs/PRODUCTION.md).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DB:-heaven_and_angel_scents}
      # Limited app user, rights on MYSQL_DATABASE only.
      MYSQL_USER: ${DB_APP_USER:-heaven_app}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
    # Host-only port for MySQL Workbench (host 3306 is local MySQL).
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Applies schema.sql on every `up` (idempotent). Back up before schema changes.
  migrate:
    image: mysql:8.4
    restart: "no"
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./schema.sql:/schema.sql:ro
    # Retry only while the db is not up; any other failure is a real SQL error, so stop.
    command:
      - sh
      - -c
      - |
        for i in $$(seq 1 30); do
          if out=$$(mysql -h db -uroot < /schema.sql 2>&1); then
            exit 0
          fi
          echo "$$out" >&2
          case "$$out" in
            *"ERROR 2002"*|*"ERROR 2003"*|*"ERROR 2013"*)
              echo "migrate: db not ready (attempt $$i/30), retrying" >&2
              sleep 3
              ;;
            *)
              echo "migrate: schema.sql failed with the error above - not retrying" >&2
              exit 1
              ;;
          esac
        done
        exit 1

  web:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      # App gets the limited DB user, never root (overrides env_file).
      DB_ROOT_PASSWORD: ""
      MYSQL_ROOT_PASSWORD: ""
      APP_ENV: production
      FLASK_DEBUG: "0"
      ALLOW_DATA_RESET: "0"
      # Set 1 in .env only to wipe test data via Clear Data, then back to 0.
      ALLOW_DATA_RESET_IN_PRODUCTION: ${ALLOW_DATA_RESET_IN_PRODUCTION:-0}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${DB_APP_USER:-heaven_app}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD}
      MYSQL_DB: ${MYSQL_DB:-heaven_and_angel_scents}
      # Only Caddy reaches this container, so X-Forwarded-* is trusted.
      # "same-origin" accepts any host used (domain or LAN IP) for realtime.
      SOCKETIO_CORS_ALLOWED_ORIGINS: ${SOCKETIO_CORS_ALLOWED_ORIGINS:-same-origin}
      # Required so the portal link survives restarts.
      PARTNER_PORTAL_SLUG: ${PARTNER_PORTAL_SLUG:?set PARTNER_PORTAL_SLUG in .env}
      TRUST_PROXY: "1"
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    volumes:
      - uploads:/app/static/uploads
      # Restore safety copies; kept across rebuilds.
      - appbackups:/app/backups

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "8080:80"
      - "8443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Daily DB dump + uploads archive into ./backups; copy it off the server too.
  backup:
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      MYSQL_DB: ${MYSQL_DB:-heaven_and_angel_scents}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    volumes:
      - uploads:/data/uploads:ro
      - ./backups:/backups
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # pipefail: a failed mysqldump must not look like "backup ok".
        set -o pipefail
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          tmp="/backups/$${MYSQL_DB}_$$ts.sql.gz.tmp"
          # Retry briefly in case the db is still starting.
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if mysqldump -h db -uroot --single-transaction --routines --triggers --events "$$MYSQL_DB" | gzip > "$$tmp" && [ "$$(stat -c %s "$$tmp")" -gt 200 ]; then
              ok=1; break
            fi
            rm -f "$$tmp"
            sleep 10
          done
          if [ "$$ok" = 1 ]; then
            mv "$$tmp" "/backups/$${MYSQL_DB}_$$ts.sql.gz"
            echo "backup ok: $$ts"
            # Optional dead-man's-switch: ping only on success.
            if [ -n "$${BACKUP_HEARTBEAT_URL:-}" ]; then
              curl -fsS -m 10 --retry 3 "$$BACKUP_HEARTBEAT_URL" >/dev/null || echo "heartbeat ping FAILED: $$ts" >&2
            fi
          else
            echo "backup FAILED: $$ts" >&2
          fi
          tar -czf "/backups/uploads_$$ts.tar.gz" -C /data uploads || echo "uploads archive FAILED: $$ts" >&2
          find /backups -type f \( -name '*.sql.gz' -o -name '*.tar.gz' \) -mtime +$$BACKUP_RETENTION_DAYS -delete
          sleep 86400
        done

  # Optional off-host copy of ./backups (--profile offsite), configured in .env:
  #   RCLONE_CONFIG_OFFSITE_TYPE=s3  RCLONE_CONFIG_OFFSITE_PROVIDER=Cloudflare
  #   RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID=...  RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY=...
  #   RCLONE_CONFIG_OFFSITE_ENDPOINT=...  OFFSITE_DEST=offsite:my-bucket/heaven-angel
  # Uses `copy`, not `sync`, so local deletes never reach the off-host copy.
  offsite:
    image: rclone/rclone:1.68
    profiles: ["offsite"]
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      # rclone needs only RCLONE_*/OFFSITE_*; blank the app secrets.
      SECRET_KEY: ""
      DB_ROOT_PASSWORD: ""
      DB_APP_PASSWORD: ""
      MYSQL_PASSWORD: ""
      MAIL_PASSWORD: ""
      GEMINI_API_KEY: ""
      BACKUP_ZIP_PASSWORD: ""
    volumes:
      - ./backups:/backups:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if rclone copy /backups "$$OFFSITE_DEST" --include "*.sql.gz" --include "*.tar.gz" --include "*.zip"; then
            echo "offsite copy ok: $$(date +%Y%m%d_%H%M%S)"
            if [ -n "$${OFFSITE_HEARTBEAT_URL:-}" ]; then
              wget -q -T 10 -O /dev/null "$$OFFSITE_HEARTBEAT_URL" || echo "offsite heartbeat FAILED" >&2
            fi
          else
            echo "offsite copy FAILED: $$(date +%Y%m%d_%H%M%S)" >&2
          fi
          sleep 21600
        done

volumes:
  dbdata:
  uploads:
  appbackups:
  caddy_data:
  caddy_config:
