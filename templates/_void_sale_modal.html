{# Void-a-sale dialog shared by admin and branch Sales History; reason is required. #}
<div class="void-overlay" id="voidSaleOverlay" style="display:none;">
  <div class="card card-pad void-modal">
    <h2 class="void-title">Void this sale?</h2>
    <p class="void-note">
      <strong id="voidSaleLabel"></strong> will be removed from sales and its stock returned.
    </p>
    <form method="POST" id="voidSaleForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="voidSaleReason">Reason</label>
        <textarea id="voidSaleReason" name="reason" rows="3" maxlength="255" required
          placeholder="e.g. Wrong item scanned, customer returned it, entered twice"></textarea>
      </div>
      <div class="void-actions">
        <button type="button" class="btn btn-ghost" id="voidSaleCancel">Cancel</button>
        <button type="submit" class="btn btn-danger">Void sale</button>
      </div>
    </form>
  </div>
</div>
